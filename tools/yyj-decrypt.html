<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>幽幽机资源解密器</title>
  <style>
    :root{font-family:Inter,"PingFang SC","Microsoft YaHei",sans-serif;color:#222;background:#f3f0eb}body{margin:0;padding:32px 18px}.shell{max-width:760px;margin:auto}.card{background:#fff;border:1px solid #ddd4ca;border-radius:22px;padding:24px;box-shadow:0 18px 50px #49392718}h1{margin:0 0 8px;font-size:26px}p{color:#6e655d;line-height:1.65}.fields{display:grid;gap:14px;margin:24px 0}label{display:grid;gap:7px;font-weight:700}input,button{font:inherit}input{padding:12px;border:1px solid #d8cfc6;border-radius:12px;background:#fbfaf8}button{border:0;border-radius:12px;padding:12px 16px;background:#292521;color:#fff;font-weight:800;cursor:pointer}button:disabled{opacity:.45;cursor:not-allowed}.status{min-height:24px;color:#9a4334}.meta{display:none;margin-top:20px;padding:14px;border-radius:14px;background:#f7f4ef}.meta.is-open{display:block}pre{overflow:auto;max-height:420px;padding:16px;border-radius:14px;background:#211f1d;color:#f5efe7;font:12px/1.55 ui-monospace,Consolas,monospace;white-space:pre-wrap}.actions{display:flex;gap:10px;flex-wrap:wrap}.secondary{background:#e9e2da;color:#332f2b}
  </style>
</head>
<body><main class="shell"><section class="card"><h1>幽幽机资源解密器</h1><p>所有解密都在当前浏览器内完成。私钥不会上传，也不会写入浏览器存储。请勿在他人设备上选择私钥。</p><div class="fields"><label>幽幽机资源（.yyj / .yyj.png）<input id="resource" type="file" accept=".yyj,.png,application/vnd.youyouji.resource+json,image/png"></label><label>RSA 私钥（PKCS#8 PEM）<input id="key" type="file" accept=".pem,.key,text/plain"></label></div><div class="actions"><button id="decrypt">解密</button><button id="download" class="secondary" disabled>导出已解密 JSON</button></div><p id="status" class="status"></p><div id="meta" class="meta"></div><pre id="output" hidden></pre></section></main>
<script type="module">
const resourceInput=document.querySelector('#resource'),keyInput=document.querySelector('#key'),status=document.querySelector('#status'),output=document.querySelector('#output'),meta=document.querySelector('#meta'),download=document.querySelector('#download');let decoded=null;
const bytesToText=b=>new TextDecoder().decode(b);const b64ToBytes=v=>Uint8Array.from(atob(v),c=>c.charCodeAt(0));const readU32=(b,o)=>((b[o]<<24)|(b[o+1]<<16)|(b[o+2]<<8)|b[o+3])>>>0;
function envelopeFromPng(bytes){let o=8;while(o+12<=bytes.length){const n=readU32(bytes,o),t=bytesToText(bytes.subarray(o+4,o+8)),s=o+8,e=s+n;if(e+4>bytes.length)break;if(t==='tEXt'){const d=bytes.subarray(s,e),z=d.indexOf(0);if(z>0&&bytesToText(d.subarray(0,z))==='youyouji'){return JSON.parse(bytesToText(b64ToBytes(bytesToText(d.subarray(z+1)))));}}o=e+4;}throw new Error('PNG 中没有幽幽机加密数据');}
function normalizePem(v){return v.replace(/-----BEGIN [^-]+-----|-----END [^-]+-----/g,'').replace(/\s+/g,'');}
async function decryptEnvelope(v,keyText){if(v?.format!=='youyouji-resource'||v?.formatVersion!==2)throw new Error('不是可识别的幽幽机资源');const slot=v?.crypto?.keySlots?.ownerAudit;if(!slot)throw new Error('这份资源没有作者审计通道');const privateKey=await crypto.subtle.importKey('pkcs8',b64ToBytes(normalizePem(keyText)),{name:'RSA-OAEP',hash:'SHA-256'},false,['unwrapKey']);const aes=await crypto.subtle.unwrapKey('raw',b64ToBytes(slot.wrappedKey),privateKey,{name:'RSA-OAEP'},{name:'AES-GCM',length:256},false,['decrypt']);const header={format:v.format,formatVersion:v.formatVersion,kind:v.kind,exportedAt:v.exportedAt,keyId:v.keyId};const plain=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64ToBytes(v.crypto.iv),additionalData:new TextEncoder().encode(JSON.stringify(header)),tagLength:128},aes,b64ToBytes(v.ciphertext));return JSON.parse(bytesToText(new Uint8Array(plain)));}
document.querySelector('#decrypt').onclick=async()=>{status.textContent='';output.hidden=true;meta.className='meta';download.disabled=true;decoded=null;try{const rf=resourceInput.files[0],kf=keyInput.files[0];if(!rf||!kf)throw new Error('请选择资源文件和私钥文件');const bytes=new Uint8Array(await rf.arrayBuffer());const envelope=rf.name.toLowerCase().endsWith('.png')?envelopeFromPng(bytes):JSON.parse(bytesToText(bytes));decoded=await decryptEnvelope(envelope,await kf.text());const chain=decoded.provenance||[];meta.textContent=`类型：${envelope.kind}　密钥：${envelope.keyId}　来源链：${chain.length} 次导出`;meta.className='meta is-open';output.textContent=JSON.stringify(decoded,null,2);output.hidden=false;download.disabled=false;status.textContent='解密完成。';}catch(e){status.textContent=e?.message||'解密失败';}};
download.onclick=()=>{if(!decoded)return;const blob=new Blob([JSON.stringify(decoded,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='youyouji-decrypted.json';a.click();URL.revokeObjectURL(url);};
</script></body></html>
