<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>XSJ 本地聊天恢复</title>
  <style>
    :root { color-scheme: light; font-family: Inter, "PingFang SC", "Microsoft YaHei", sans-serif; background: #f4f1ec; color: #262421; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; }
    main { width: min(560px, 100%); padding: 28px; border: 1px solid #e3ddd3; border-radius: 24px; background: #fffdf9; box-shadow: 0 20px 60px rgba(66, 54, 40, .1); }
    h1 { margin: 0 0 8px; font-size: 26px; }
    .lead { margin: 0 0 22px; color: #716b63; line-height: 1.65; }
    .origin { margin-bottom: 18px; padding: 10px 12px; border-radius: 12px; background: #f5f2ec; color: #5f5a52; font-size: 13px; word-break: break-all; }
    .stats { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
    .stat { padding: 16px; border: 1px solid #ebe5dc; border-radius: 16px; background: white; }
    .stat span { display: block; color: #817a70; font-size: 13px; }
    .stat strong { display: block; margin-top: 6px; font-size: 26px; }
    #status { margin: 18px 0; padding: 12px 14px; border-radius: 14px; background: #f3f0eb; line-height: 1.55; }
    #status.good { background: #edf6ee; color: #2e6a3c; }
    #status.warn { background: #fff3df; color: #82530b; }
    .actions { display: grid; gap: 10px; }
    button { min-height: 48px; border: 0; border-radius: 14px; font: inherit; font-weight: 700; cursor: pointer; }
    button.primary { background: #d97757; color: white; }
    button.secondary { background: #ece7df; color: #3f3a34; }
    button:disabled { cursor: not-allowed; opacity: .45; }
    .note { margin: 16px 0 0; color: #8b847a; font-size: 12px; line-height: 1.6; }
  </style>
</head>
<body>
  <main>
    <h1>本地聊天恢复</h1>
    <p class="lead">使用 Edge 自己的解码器读取当前地址下的 IndexedDB。检测过程不会上传、清理或覆盖聊天。</p>
    <div class="origin" id="origin"></div>
    <section class="stats" aria-label="检测结果">
      <div class="stat"><span>可恢复会话</span><strong id="sessions">—</strong></div>
      <div class="stat"><span>可恢复消息</span><strong id="messages">—</strong></div>
    </section>
    <div id="status">正在只读检测……</div>
    <div class="actions">
      <button class="primary" id="restore" type="button" disabled>恢复并打开应用</button>
      <button class="secondary" id="download" type="button" disabled>另存一份聊天备份</button>
    </div>
    <p class="note">如果 localhost 检测为 0，请再用 127.0.0.1 打开同一路径；这两个地址在浏览器中属于两套独立存储。</p>
  </main>
  <script>
    const key = 'xsj-chat-sessions';
    const dbName = 'xsj-local-assets';
    const storeName = 'records';
    const origin = document.getElementById('origin');
    const status = document.getElementById('status');
    const sessionsNode = document.getElementById('sessions');
    const messagesNode = document.getElementById('messages');
    const restoreButton = document.getElementById('restore');
    const downloadButton = document.getElementById('download');
    let recoveredSessions = null;

    origin.textContent = `正在检查：${location.origin}`;

    function countMessages(sessions) {
      return Array.isArray(sessions)
        ? sessions.reduce((total, session) => total + (Array.isArray(session?.messages) ? session.messages.length : 0), 0)
        : 0;
    }

    function readIndexedDbRecord() {
      return new Promise((resolve, reject) => {
        const request = indexedDB.open(dbName);
        request.onerror = () => reject(request.error || new Error('IndexedDB 打开失败'));
        request.onsuccess = () => {
          const db = request.result;
          if (!db.objectStoreNames.contains(storeName)) {
            db.close();
            resolve(null);
            return;
          }
          const transaction = db.transaction(storeName, 'readonly');
          const get = transaction.objectStore(storeName).get(key);
          get.onerror = () => reject(get.error || new Error('聊天记录读取失败'));
          get.onsuccess = () => {
            const record = get.result || null;
            db.close();
            resolve(record);
          };
        };
      });
    }

    function readLegacyLocalSessions() {
      try {
        const raw = localStorage.getItem(key);
        if (!raw) return null;
        const value = JSON.parse(raw);
        return Array.isArray(value) ? value : null;
      } catch {
        return null;
      }
    }

    async function inspect() {
      try {
        const [record, localSessions] = await Promise.all([
          readIndexedDbRecord(),
          Promise.resolve(readLegacyLocalSessions()),
        ]);
        const indexedSessions = Array.isArray(record?.value) ? record.value : null;
        recoveredSessions = countMessages(indexedSessions) >= countMessages(localSessions) ? indexedSessions : localSessions;
        const sessionCount = Array.isArray(recoveredSessions) ? recoveredSessions.length : 0;
        const messageCount = countMessages(recoveredSessions);
        sessionsNode.textContent = String(sessionCount);
        messagesNode.textContent = String(messageCount);
        if (messageCount > 0) {
          status.className = 'good';
          status.textContent = `已找到本地聊天：${sessionCount} 个会话、${messageCount} 条消息。建议先另存备份，再恢复。`;
          restoreButton.disabled = false;
          downloadButton.disabled = false;
        } else {
          status.className = 'warn';
          status.textContent = `这个地址下没有读到聊天。请把地址栏中的 ${location.hostname} 换成 ${location.hostname === 'localhost' ? '127.0.0.1' : 'localhost'} 后再试。`;
        }
      } catch (error) {
        status.className = 'warn';
        status.textContent = `读取失败：${error instanceof Error ? error.message : String(error)}`;
      }
    }

    downloadButton.addEventListener('click', () => {
      if (!Array.isArray(recoveredSessions)) return;
      const blob = new Blob([JSON.stringify(recoveredSessions)], { type: 'application/json;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const link = document.createElement('a');
      link.href = url;
      link.download = `xsj-chat-backup-${new Date().toISOString().replace(/[:.]/g, '-')}.json`;
      link.click();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
    });

    restoreButton.addEventListener('click', async () => {
      if (!Array.isArray(recoveredSessions)) return;
      restoreButton.disabled = true;
      status.className = '';
      status.textContent = '正在建立恢复指针……';
      const request = indexedDB.open(dbName, 2);
      request.onerror = () => {
        restoreButton.disabled = false;
        status.className = 'warn';
        status.textContent = `恢复失败：${request.error || 'IndexedDB 无法写入'}`;
      };
      request.onupgradeneeded = () => {
        const db = request.result;
        if (!db.objectStoreNames.contains(storeName)) db.createObjectStore(storeName, { keyPath: 'key' });
      };
      request.onsuccess = () => {
        const db = request.result;
        const transaction = db.transaction(storeName, 'readwrite');
        transaction.objectStore(storeName).put({ key, value: recoveredSessions, updatedAt: Date.now() });
        transaction.onerror = () => {
          restoreButton.disabled = false;
          status.className = 'warn';
          status.textContent = `恢复失败：${transaction.error || '聊天数据无法写入'}`;
        };
        transaction.oncomplete = () => {
          localStorage.setItem(key, JSON.stringify({ kind: 'xsj-indexeddb-state-v1', key, updatedAt: Date.now() }));
          db.close();
          location.href = '/';
        };
      };
    });

    void inspect();
  </script>
</body>
</html>
