<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#eef2f7" />
    <title>幽幽机 · 离线</title>
    <style>
      :root { color-scheme: light; font-family: ui-rounded, "PingFang SC", "Microsoft YaHei", sans-serif; }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; color: #26303b; background: #eef2f7; }
      main { width: min(100%, 360px); padding: 30px 26px; border: 1px solid rgba(38, 48, 59, .12); border-radius: 28px; background: rgba(255, 255, 255, .78); box-shadow: 0 24px 70px rgba(46, 61, 78, .12); }
      span { display: grid; width: 46px; height: 46px; place-items: center; border-radius: 16px; background: #26303b; color: white; font-size: 23px; }
      h1 { margin: 22px 0 10px; font-size: 24px; }
      p { margin: 0; color: #697582; line-height: 1.7; }
      button { width: 100%; margin-top: 24px; padding: 13px 18px; border: 0; border-radius: 16px; color: white; background: #26303b; font: inherit; font-weight: 700; cursor: pointer; }
    </style>
  </head>
  <body>
    <main>
      <span aria-hidden="true">↻</span>
      <h1>现在没有网络</h1>
      <p>已缓存的数据仍保留在这台设备上。恢复连接后重新尝试即可。</p>
      <button type="button" onclick="location.reload()">重新尝试</button>
    </main>
  </body>
</html>
